<style>
/* Tipografías de la plantilla de David: Sora (títulos), Manrope (texto), IBM Plex Mono (cifras y etiquetas).
   Dos temas, cada uno ligado a una opción de nombre: «noche» (oscuro azulado de la plantilla con acento cobre) y «alba» (claro y cálido). */
:root{
  --f-cuerpo:'Manrope',system-ui,'Segoe UI',Roboto,sans-serif;
  --f-titulo:'Sora','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --radio:16px;
}
:root[data-tema=noche]{
  --bg:#0A0C14; --bg2:#10131F; --panel:#141826; --suave:#1A1F31; --ink:#F6F1EC; --muted:#A5A9BC; --dim:#7B8096; --line:#252B42;
  --acc:#E8956A; --acc-ink:#1D0F07; --acc-soft:#3A2418; --acc2:#F2C27B;
  --grad:linear-gradient(135deg,#F2A472 0%,#C4672F 100%);
  --halo:radial-gradient(60% 50% at 50% 0%,rgba(232,149,106,.22),rgba(10,12,20,0) 70%);
  --ok:#5EE6A0; --ok-soft:#123324; --warn:#F5B14C; --warn-soft:#2D2410; --bad:#F68A8A; --bad-soft:#3A1A1E;
  --vidrio:#2A3050; --agua:#E8956A; --agua2:#F6C79F;
  --sombra:0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
:root[data-tema=alba]{
  --bg:#FBF5EC; --bg2:#F5EBDC; --panel:#FFFFFF; --suave:#FBF1E3; --ink:#2B1A12; --muted:#6D5A4E; --dim:#8C7869; --line:#EADBC8;
  --acc:#B4531C; --acc-ink:#FFFFFF; --acc-soft:#F8E1CD; --acc2:#D9962B;
  --grad:linear-gradient(135deg,#D2793A 0%,#8F3E10 100%);
  --halo:radial-gradient(60% 50% at 50% 0%,rgba(217,150,43,.28),rgba(251,245,236,0) 70%);
  --ok:#166534; --ok-soft:#DCF3E3; --warn:#9A4A07; --warn-soft:#FDEBC8; --bad:#B91C1C; --bad-soft:#FBDADA;
  --vidrio:#E8D8C2; --agua:#C46A2B; --agua2:#E9A765;
  --sombra:0 8px 26px rgba(120,70,20,.12);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-cuerpo);min-height:100vh}
body::before{content:'';position:absolute;inset:0 0 auto 0;height:420px;background:var(--halo);pointer-events:none;z-index:0}
h1,h2,h3,h4{font-family:var(--f-titulo);line-height:1.18;margin:0;color:var(--ink)}
h1{font-size:clamp(28px,7.2vw,40px);font-weight:700;letter-spacing:-.02em}
h2{font-size:21px;font-weight:650} h3{font-size:17px;font-weight:650}
p{margin:0 0 10px}
a{color:var(--acc)}
small,.peq{font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
[hidden]{display:none!important}
.etq{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.kicker{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin-bottom:10px}
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sep{flex:1}
.mt{margin-top:16px} .mt2{margin-top:8px} .mt3{margin-top:28px}

/* estructura */
.envoltura{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:0 16px 90px}
.envoltura.ancha{max-width:1040px}
.cab{display:flex;align-items:center;gap:10px;padding:16px 0}
.marca{display:flex;align-items:center;gap:10px;font-family:var(--f-titulo);font-weight:700;font-size:17px;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.marca svg{width:34px;height:34px;display:block}
.tarjeta{background:var(--panel);border:1px solid var(--line);border-radius:var(--radio);padding:20px;box-shadow:var(--sombra);margin-top:16px}
.tarjeta h2{margin-bottom:6px}
.tarjeta>.etq:first-child{display:block;margin-bottom:6px}

/* portada */
.portada{padding:8px 0 4px;text-align:center}
.portada h1{margin:6px auto 12px;max-width:16ch}
.portada .lema{font-size:17px;color:var(--muted);max-width:34ch;margin:0 auto 6px}
.retrato{width:132px;height:132px;border-radius:50%;margin:0 auto 14px;border:3px solid var(--acc);padding:4px;background:var(--panel);display:block;object-fit:cover;box-shadow:0 0 0 8px var(--acc-soft)}
.retrato-ph{display:flex;align-items:center;justify-content:center}
.retrato-ph svg{width:70px;height:70px}

/* avance: vaso que se llena */
.avance{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.vaso{width:116px;flex:none}
.vaso svg{width:100%;height:auto;display:block;overflow:visible}
.cifras{flex:1;min-width:200px;text-align:left}
.cifra-grande{font-family:var(--f-titulo);font-weight:700;font-size:clamp(34px,9vw,46px);letter-spacing:-.02em;line-height:1.05;color:var(--ink)}
.cifra-meta{color:var(--muted);font-size:15px;margin-top:2px}
.barra{height:12px;border-radius:99px;background:var(--suave);overflow:hidden;margin:14px 0 6px;border:1px solid var(--line)}
.barra>i{display:block;height:100%;border-radius:99px;background:var(--grad);width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.hito{margin-top:10px;padding:10px 14px;border-radius:12px;background:var(--acc-soft);color:var(--ink);font-weight:600;font-size:15px}
.hito.logro{background:var(--ok-soft);color:var(--ok)}
.datos3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.dato{background:var(--suave);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.dato b{display:block;font-family:var(--f-titulo);font-size:20px;letter-spacing:-.01em}
.dato span{font-size:12px;color:var(--muted)}

/* cuenta regresiva */
.reloj{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin-top:12px}
.reloj div{background:var(--suave);border:1px solid var(--line);border-radius:12px;padding:10px 4px}
.reloj b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:600;color:var(--acc);font-variant-numeric:tabular-nums}
.reloj span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.reloj-aviso{text-align:center;margin-top:8px;font-weight:600}
.reloj-aviso.urge{color:var(--warn)}

/* botones y formularios */
.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--suave);color:var(--ink);padding:11px 18px;border-radius:12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2;min-height:44px}
.btn:hover{border-color:var(--acc)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.btn.primario{background:var(--grad);color:var(--acc-ink);border-color:transparent;box-shadow:0 6px 18px rgba(196,103,47,.35)}
.btn.primario:hover{filter:brightness(1.06)}
.btn.grande{width:100%;font-size:17px;padding:14px 18px}
.btn.peq{padding:7px 12px;font-size:13.5px;min-height:34px;border-radius:10px}
.btn.mala{color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.campo{display:block;margin-top:12px}
.campo>span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px}
input,textarea,select{font:inherit;width:100%;color:var(--ink);background:var(--bg2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:46px}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:84px}
.err{color:var(--bad);font-size:13.5px;margin-top:5px;font-weight:600}
.fichas{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.ficha{border:1.5px solid var(--line);background:var(--suave);color:var(--ink);padding:9px 14px;border-radius:99px;font:inherit;font-weight:700;cursor:pointer;min-height:40px}
.ficha[aria-pressed=true]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.cuenta{display:inline-block}

/* listas */
.lista{list-style:none;margin:8px 0 0;padding:0}
.lista li{padding:12px 0;border-top:1px solid var(--line)}
.lista li:first-child{border-top:0}
.item-comprar{display:flex;gap:12px;align-items:flex-start}
.check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;margin-top:2px;font-size:14px;color:transparent}
.check.si{background:var(--ok);border-color:var(--ok);color:#fff}
.muro-n{font-weight:700}
.muro-m{color:var(--muted);font-size:14.5px;margin-top:2px}
.corazon{color:var(--acc)}
.pago{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-all;background:var(--bg2);border:1.5px dashed var(--acc);border-radius:12px;padding:14px;font-family:var(--f-mono);font-size:14.5px;margin:10px 0}
.qr{display:block;max-width:220px;width:100%;border-radius:12px;margin:10px auto;background:#fff;padding:6px}
.gracias{background:var(--ok-soft);border:1px solid var(--ok);border-radius:14px;padding:16px;margin-top:14px}
.gracias h3{color:var(--ok);margin-bottom:6px}
.muro-n,.muro-m,.peq,.aviso,.lema,.cifra-meta,p{overflow-wrap:anywhere}
.marcar{display:flex;gap:10px;align-items:flex-start;flex-wrap:nowrap;cursor:pointer}
.insignia{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:99px;font-size:11px;font-weight:700;background:var(--acc-soft);color:var(--acc);vertical-align:middle}
.cita{font-family:var(--f-titulo);font-size:17px;line-height:1.4;color:var(--acc2);border-left:3px solid var(--acc);padding-left:12px}
.equiv li{padding:8px 0}
.equiv b{color:var(--acc)}
.proposito p{font-size:16.5px}
.tarjeta-vista{display:block;max-width:300px;width:100%;height:auto;margin:12px auto;border-radius:14px;border:1px solid var(--line);box-shadow:var(--sombra)}
.totales3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.totales3 .dato{min-width:0;padding:10px 4px}
.totales3 .dato b{font-size:16px}
.resaltar{box-shadow:0 0 0 3px var(--acc),var(--sombra)}
.aviso{padding:12px 14px;border-radius:12px;margin-top:12px;font-weight:600}
.aviso.info{background:var(--acc-soft)} .aviso.mal{background:var(--bad-soft);color:var(--bad)} .aviso.bien{background:var(--ok-soft);color:var(--ok)} .aviso.ojo{background:var(--warn-soft);color:var(--warn)}
.vacio{color:var(--muted);text-align:center;padding:24px 8px}
.pie{margin-top:36px;text-align:center;color:var(--dim);font-size:13px}

/* panel */
nav.pestanas{display:flex;gap:4px;flex-wrap:wrap;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-top:6px}
nav.pestanas a{padding:9px 14px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:700;white-space:nowrap}
nav.pestanas a.on{background:var(--acc-soft);color:var(--acc)}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-family:var(--f-mono)}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
.chip.confirmado{background:var(--ok-soft);color:var(--ok)} .chip.pendiente{background:var(--warn-soft);color:var(--warn)} .chip.rechazado{background:var(--bad-soft);color:var(--bad)}
.acciones{display:flex;gap:6px;flex-wrap:wrap}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--ink);padding:22px;max-width:min(520px,94vw);width:100%;box-shadow:var(--sombra)}
dialog::backdrop{background:rgba(0,0,0,.55)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:700;z-index:50;max-width:92vw;text-align:center;box-shadow:var(--sombra)}
.tabla-scroll{overflow-x:auto}

/* celebración */
.confeti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.confeti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:cae 3.8s linear forwards}
@keyframes cae{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){.barra>i{transition:none}.confeti{display:none}}
@media (max-width:420px){.datos3{grid-template-columns:1fr 1fr 1fr;gap:6px}.dato b{font-size:17px}.reloj b{font-size:21px}.tarjeta{padding:16px}}

</style>

/* Núcleo: lógica pura, sin pantalla. Funciona en el navegador (variable global NUCLEO) y en Node (module.exports).

/* Capa de datos. Dos maneras de guardar, con la MISMA interfaz:
   · local → localStorage del navegador (demostración y pruebas; nada sale del aparato).
   · nube  → Firestore por REST (la familia lee la campaña y crea aportes sin sesión; David entra con Google para el resto).
   Las reglas de Firestore (reglas_firestore.txt) son las que protegen: aquí solo se pide lo permitido. */
const DATOS = (() => {
  const nube = CONFIG.modo === 'nube' && CONFIG.firebase;

  function falla(codigo, mensaje) { const e = new Error(mensaje || codigo); e.codigo = codigo; return e; }

  /* ================= LOCAL ================= */
  function crearLocal() {
    const K = 'nonita:';
    const leer = (k, def) => { try { const t = localStorage.getItem(K + k); return t ? JSON.parse(t) : def; } catch (e) { return def; } };
    const guardar = (k, v) => { try { localStorage.setItem(K + k, JSON.stringify(v)); } catch (e) { throw falla('almacenamiento', 'No se pudo guardar en este aparato (¿modo privado o memoria llena?).'); } };
    const A = {
      modo: 'local',
      async leerCampana(clave) { return (leer('campanas', {}))[clave] || null; },
      suscribirCampana(clave, cb) {
        let ultimo = '';
        const paso = async () => { const c = await A.leerCampana(clave); const s = JSON.stringify(c); if (s !== ultimo) { ultimo = s; cb(c); } };
        paso(); const t = setInterval(paso, 2000); return () => clearInterval(t);
      },
      async crearAporte(clave, a) {
        if (!(await A.leerCampana(clave))) throw falla('permiso', 'Esa campaña no existe.');
        const lista = leer('aportes', []);
        const nuevo = { id: idAzar(), campana: clave, nombre: a.nombre, monto: a.monto, msg: a.msg || '', grupo: a.grupo || 'familia', t: new Date().toISOString() };
        if (a.ref) nuevo.ref = a.ref;
        lista.push(nuevo); guardar('aportes', lista);
      },
      async crearIdea(clave, i) {
        if (!(await A.leerCampana(clave))) throw falla('permiso', 'Esa campaña no existe.');
        const lista = leer('ideas', []); lista.push({ id: idAzar(), campana: clave, nombre: i.nombre, texto: i.texto, t: new Date().toISOString() }); guardar('ideas', lista);
      },
      /* panel */
      onSesion(cb) { setTimeout(() => cb({ email: 'prueba-local', local: true }), 0); },
      async entrar() { return { email: 'prueba-local', local: true }; },
      async salir() {},
      async listarCampanas() { const c = leer('campanas', {}); return Object.keys(c).map(clave => ({ clave, doc: c[clave] })); },
      async guardarCampana(clave, doc) { const c = leer('campanas', {}); c[clave] = doc; guardar('campanas', c); },
      async borrarCampana(clave) { const c = leer('campanas', {}); delete c[clave]; guardar('campanas', c); guardar('aportes', leer('aportes', []).filter(a => a.campana !== clave)); },
      async listarAportes(clave) { return leer('aportes', []).filter(a => a.campana === clave); },
      async guardarAporte(a) {
        const lista = leer('aportes', []); const id = a.id || idAzar();
        const i = lista.findIndex(x => x.id === id); const nuevo = Object.assign({}, a, { id });
        if (i >= 0) lista[i] = nuevo; else lista.push(nuevo);
        guardar('aportes', lista); return id;
      },
      async borrarAporte(id) { guardar('aportes', leer('aportes', []).filter(a => a.id !== id)); },
      async listarIdeas(clave) { return leer('ideas', []).filter(i => i.campana === clave); },
      async guardarIdea(i) { const l = leer('ideas', []); const id = i.id || idAzar(); const n = Object.assign({}, i, { id }); const k = l.findIndex(x => x.id === id); if (k >= 0) l[k] = n; else l.push(n); guardar('ideas', l); return id; },
      async borrarIdea(id) { guardar('ideas', leer('ideas', []).filter(i => i.id !== id)); },
      async leerEstado() { return leer('estado', null); },
      async guardarEstado(e) { guardar('estado', e); },

  }

  /* ================= NUBE (Firestore por REST) ================= */
  function crearNube() {
    const cfg = CONFIG.firebase;
    let base = 'https://firestore.googleapis.com/v1/projects/' + cfg.projectId + '/databases/(default)/documents';
    let tokenPrueba = null;
    try { // solo en localhost, para las pruebas con un servidor falso
      const q = new URLSearchParams(location.search);
      if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && q.get('api')) base = location.origin + q.get('api');
      if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && q.get('token')) tokenPrueba = q.get('token');
    } catch (e) { /* sin URL */ }

    /* --- valores de Firestore <-> objetos normales --- */
    function aFs(v) {
      if (v === null || v === undefined) return { nullValue: null };
      if (typeof v === 'string') return { stringValue: v };
      if (typeof v === 'boolean') return { booleanValue: v };
      if (typeof v === 'number') return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
      if (v instanceof Date) return { timestampValue: v.toISOString() };
      if (Array.isArray(v)) return { arrayValue: { values: v.map(aFs) } };
      const campos = {}; Object.keys(v).forEach(k => { if (v[k] !== undefined) campos[k] = aFs(v[k]); });
      return { mapValue: { fields: campos } };
    }
    function deFs(v) {
      if ('stringValue' in v) return v.stringValue;
      if ('integerValue' in v) return Number(v.integerValue);
      if ('doubleValue' in v) return v.doubleValue;
      if ('booleanValue' in v) return v.booleanValue;
      if ('timestampValue' in v) return v.timestampValue;
      if ('nullValue' in v) return null;
      if ('arrayValue' in v) return (v.arrayValue.values || []).map(deFs);
      if ('mapValue' in v) return objDe(v.mapValue.fields || {});
      return null;
    }
    const objDe = f => { const o = {}; Object.keys(f || {}).forEach(k => { o[k] = deFs(f[k]); }); return o; };
    const objA = o => { const f = {}; Object.keys(o).forEach(k => { if (o[k] !== undefined) f[k] = aFs(o[k]); }); return f; };
    const idDe = d => d.name.split('/').pop();

    /* --- sesión de David (SDK de Firebase solo para iniciar sesión con Google) --- */
    let auth = null, usuario = null, oyentes = [];
    async function cargarAuth() {
      if (auth) return auth;
      const u = 'https://www.gstatic.com/firebasejs/10.14.1/';
      const [app, au] = await Promise.all([import(u + 'firebase-app.js'), import(u + 'firebase-auth.js')]);

    }
    async function token() {
      if (tokenPrueba) return tokenPrueba;
      if (!auth || !auth.inst.currentUser) throw falla('sinSesion', 'Falta iniciar sesión.');
      return auth.inst.currentUser.getIdToken();
    }
    async function pedir(metodo, ruta, cuerpo, conSesion) {
      const h = { 'content-type': 'application/json' };
      if (conSesion) h.authorization = 'Bearer ' + await token();
      let r;
      try { r = await fetch(base + ruta, { method: metodo, headers: h, body: cuerpo ? JSON.stringify(cuerpo) : undefined, cache: 'no-store' }); }
      catch (e) { throw falla('red', 'Sin conexión con el servidor.'); }
      if (r.status === 404) return null;
      if (r.status === 401 || r.status === 403) throw falla('permiso', 'Esta cuenta no tiene permiso.');
      if (!r.ok) throw falla('servidor', 'El servidor respondió ' + r.status + '.');
      const t = await r.text(); return t ? JSON.parse(t) : {};
    }

    const A = {
      modo: 'nube',
      async leerCampana(clave) { const d = await pedir('GET', '/campanas/' + encodeURIComponent(clave), null, false); return d ? objDe(d.fields) : null; },
      suscribirCampana(clave, cb) {
        let ultimo = null, parar = false;
        const paso = async () => {
          if (parar || document.hidden) return;
          try { const c = await A.leerCampana(clave); const s = JSON.stringify(c); if (s !== ultimo) { ultimo = s; cb(c, null); } }
          catch (e) { cb(undefined, e); }
        };
        paso(); const t = setInterval(paso, 45000);
        const vis = () => { if (!document.hidden) paso(); }; document.addEventListener('visibilitychange', vis);
        return () => { parar = true; clearInterval(t); document.removeEventListener('visibilitychange', vis); };
      },
      async crearAporte(clave, a) {
        const campos = { campana: clave, nombre: a.nombre, monto: a.monto, msg: a.msg || '', grupo: a.grupo || 'familia', t: new Date() };
        if (a.ref) campos.ref = a.ref;
        const r = await pedir('POST', '/aportes', { fields: objA(campos) }, false);
        if (!r) throw falla('servidor', 'No se pudo anotar el aporte.');
      },
      async crearIdea(clave, i) {
        const r = await pedir('POST', '/ideas', { fields: objA({ campana: clave, nombre: i.nombre, texto: i.texto, t: new Date() }) }, false);
        if (!r) throw falla('servidor', 'No se pudo guardar la idea.');
      },
      onSesion(cb) {
        oyentes.push(cb);
        if (tokenPrueba) { usuario = { email: 'prueba@local' }; setTimeout(() => cb(usuario), 0); return; }
        cargarAuth().then(x => x.mod.onAuthStateChanged(x.inst, u => { usuario = u ? { email: u.email } : null; oyentes.forEach(f => f(usuario)); })).catch(() => cb(null, falla('red', 'No pude cargar el inicio de sesión.')));
      },
      async entrar() { const x = await cargarAuth(); const r = await x.mod.signInWithPopup(x.inst, new x.mod.GoogleAuthProvider()); return { email: r.user.email }; },
      async salir() { if (auth) await auth.mod.signOut(auth.inst); },
      async listarCampanas() { const r = await pedir('GET', '/campanas?pageSize=100', null, true); return ((r && r.documents) || []).map(d => ({ clave: idDe(d), doc: objDe(d.fields) })); },
      async guardarCampana(clave, doc) {
        const r = await pedir('PATCH', '/campanas/' + encodeURIComponent(clave), { fields: objA(doc) }, true);
        if (!r) throw falla('servidor', 'No se pudo guardar la campaña.');
        const leido = await A.leerCampana(clave);   // comprobar en el servidor, nunca fiarse de la respuesta de escritura
        if (!leido || leido.actualizado !== doc.actualizado || leido.total !== doc.total) throw falla('noVerificado', 'Se envió, pero no pude confirmar que quedó guardado.');
      },
      async borrarCampana(clave) { await pedir('DELETE', '/campanas/' + encodeURIComponent(clave), null, true); },
      async listarAportes(clave) {

        return (r || []).filter(x => x.document).map(x => Object.assign({ id: idDe(x.document) }, objDe(x.document.fields)));
      },
      async guardarAporte(a) {
        const id = a.id || idAzar(); const doc = Object.assign({}, a); delete doc.id;
        const r = await pedir('PATCH', '/aportes/' + encodeURIComponent(id), { fields: objA(doc) }, true);

        return id;
      },
      async borrarAporte(id) { await pedir('DELETE', '/aportes/' + encodeURIComponent(id), null, true); },
      async listarIdeas(clave) {
        const r = await pedir('POST', ':runQuery', { structuredQuery: { from: [{ collectionId: 'ideas' }], where: { fieldFilter: { field: { fieldPath: 'campana' }, op: 'EQUAL', value: { stringValue: clave } } }, limit: 1000 } }, true);
        return (r || []).filter(x => x.document).map(x => Object.assign({ id: idDe(x.document) }, objDe(x.document.fields)));
      },
      async guardarIdea(i) {
        const id = i.id || idAzar(); const d = Object.assign({}, i); delete d.id;
        const r = await pedir('PATCH', '/ideas/' + encodeURIComponent(id), { fields: objA(d) }, true);

      },
      async borrarIdea(id) { await pedir('DELETE', '/ideas/' + encodeURIComponent(id), null, true); },
      async leerEstado() { const d = await pedir('GET', '/estado/principal', null, true); return d ? objDe(d.fields) : null; },
      async guardarEstado(e) { await pedir('PATCH', '/estado/principal', { fields: objA(e) }, true); },
      async reiniciarTodo() { throw falla('noPermitido', 'Solo disponible en modo de prueba.'); },
      _aFs: aFs, _deFs: deFs

    return A;
  }

  return nube ? crearNube() : crearLocal();
})();

  function seccionMuro(c) {

  function render() {
